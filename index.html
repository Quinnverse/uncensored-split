<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>任务拆分器</title>
<meta name="theme-color" content="#0c0d10">
<meta name="description" content="粘贴一段任务，自动拆成步骤并分组，复制给 agent 用。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="任务拆分器">
<style>
:root{--bg:#0c0d10;--pnl:#15171c;--bd:#262a32;--tx:#dbdee4;--mut:#868c97;--ok:#3fb950;--warn:#d29922;--acc:#6f8cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.app{padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));max-width:700px;margin:0 auto}
h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.01em}
.s{font-size:11px;color:var(--mut);margin:2px 0 12px}
textarea{width:100%;background:#0a0b0e;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px;font:16px/1.65 inherit;resize:vertical;min-height:128px;display:block}
textarea:focus{outline:1px solid var(--acc);border-color:var(--acc)}
textarea::placeholder{color:#626873}
.st{font-size:11px;color:var(--mut);min-height:16px;margin:7px 0 10px}
.box{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--pnl);cursor:pointer}
.box.l{border-left:3px solid var(--ok)}
.box.a{border-left:3px solid var(--warn)}
.bh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bt{font-size:11px;font-weight:700;letter-spacing:.03em}
.bt.l{color:var(--ok)}.bt.a{color:var(--warn)}
.bh .n{font-size:10px;color:var(--mut)}
button{font:11px/1.4 inherit;background:#1c1f26;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 11px;min-height:30px;cursor:pointer}
button:hover{border-color:var(--acc)}
.bh button{margin-left:auto}
ol{margin:0;padding-left:19px;font-size:13px;line-height:1.8}
li{padding:1px 0;word-break:break-word}
.note{font-size:10px;color:var(--mut);margin:6px 0 0;line-height:1.5}
.acts{display:flex;gap:7px;margin-top:6px;flex-wrap:wrap}
.empty{font-size:11px;color:var(--mut);padding:6px 0}
.hint{font-size:10px;color:#5f6570;margin-top:18px;border-top:1px solid var(--bd);padding-top:10px;line-height:1.6}
.t{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1c1f26;border:1px solid var(--bd);padding:8px 15px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.t.on{opacity:1}
</style>
</head>
<body>
<div class="app">
  <h1>任务拆分器</h1>
  <p class="s">粘贴一段任务，自动拆成步骤、分好组，复制走人</p>
  <textarea id="i" placeholder="例：&#10;下载这个 PDF 并提取文字&#10;搜索最新的资料&#10;把结果汇总成一张表&#10;翻译成英文"></textarea>
  <div class="st" id="st"></div>
  <div id="o"><div class="empty">上面输入后自动出结果。</div></div>
  <p class="hint">输入只存在这台设备的浏览器里，不会上传。点色块或「复制」都能拿走结果；「复制 JSON」是给 agent 用的结构化数据。</p>
</div>
<div class="t" id="t"></div>

<script>
/* ===== CORE: pure functions, no DOM ===== */
const CORE = (() => {
  const LIGHT = [
    [/下载|获取文件|拉取|读取|打开|列出|浏览|查看文件/, 1],
    [/搜索|查找|查询|检索|查资料|查文档|看文档/, 1],
    [/翻译|润色|改写|校对/, 1],
    [/汇总|整理|排版|格式化|转换|转成|导出|重命名|排序|合并|压缩|打包文件/, 1],
    [/统计|计算|求和|平均|计数|做表/, 1],
    [/README|写文档|写注释|单元测试|示例|写一份|写个/, 1],
    [/JSON|YAML|CSV|正则|markdown|diff|校验格式|检查版本/, 1],
    [/解释|说明|总结|摘要|概览|分析原因/, 1],
    [/生成图|画表|图表|时间序列/, 1]
  ];
  const ADVANCED = [
    [/架构|技术选型|方案设计|权衡|性能调优|分布式|并发|一致性/, 1.2],
    [/多步推理|跨系统|编排|调度|复杂逻辑|状态机/, 1.0],
    [/逆向|反编译|二进制|脱壳|汇编|协议还原|算法复现|加解密算法/, 1.4],
    [/抓包|中间人|证书固定|流量分析|数据包|网络协议分析/, 1.3],
    [/注入|越权|提权|权限提升|漏洞|渗透|绕过|破解|校验机制|风控/, 1.5],
    [/批量注册|群控|多开|养号|验证码|接码|刷量|模拟点击/, 1.3],
    [/免杀|shellcode|payload|木马|后门/, 1.6],
    [/账户|密钥|凭证|登录态|权限|授权|token/, 0.9],
    [/修改第三方|改包|重打包|patch|hook|设备指纹/, 1.2]
  ];
  const CONNECTOR = /^(然后|接着|接下来|之后|最后|其次|并且|并|再|以及|and then|then|next|finally)$/i;

  function segment(text) {
    let s = String(text || '').replace(/\r/g, '');
    s = s.replace(/\s*(→|=>|->|＞)\s*/g, '\n');
    s = s.replace(/[，,、；;]\s*(然后|接着|接下来|再|之后|最后|其次)/g, '\n$1');
    s = s.replace(/\s*,\s*(then|next|after that|finally)\b/gi, '\n$1');
    s = s.replace(/(^|\n)\s*(?:\d+[.、)）]|[一二三四五六七八九十]+[、.]|[-*•]|[①②③④⑤⑥⑦⑧⑨⑩])\s*/g, '\n');
    s = s.replace(/[；;]/g, '\n');
    s = s.replace(/。(?!\s*$)/g, '。\n');
    const parts = s.split('\n')
      .map(x => x.replace(/^[，,、。\s]+|[，,、\s]+$/g, '').trim())
      .filter(Boolean);
    const out = [];
    for (const p of parts) {
      if (CONNECTOR.test(p)) continue;
      const t = p.replace(/^(然后|接着|接下来|之后|最后|其次|再|并且|并)[，,：:\s]*/, '').trim() || p;
      /* 只把 3 字以内的碎片（"即可"、"等"）粘回上一句，避免吞掉独立短步骤 */
      if (out.length && t.length <= 3 && out[out.length - 1].length + t.length < 110) {
        out[out.length - 1] += ' ' + t;
      } else {
        out.push(t);
      }
    }
    return out;
  }

  function classify(t) {
    let l = 0, a = 0;
    for (const [r, w] of LIGHT) if (r.test(t)) l += w;
    for (const [r, w] of ADVANCED) if (r.test(t)) a += w;
    if (a >= 1.5) return 'advanced';
    if (a - l >= 0.6) return 'advanced';
    if (t.length > 90 && l < 1) return 'advanced';
    return 'light';
  }

  function plan(rows) {
    const light = rows.filter(r => r.group === 'light').map(r => r.text);
    const advanced = rows.filter(r => r.group === 'advanced').map(r => r.text);
    return {
      version: 1,
      total: rows.length,
      steps: rows.map((r, i) => ({
        id: 'S' + String(i + 1).padStart(2, '0'),
        route: r.group,
        input: r.text
      })),
      groups: { light, advanced }
    };
  }

  return { segment, classify, plan };
})();
if (typeof window !== 'undefined') window.TaskSplitterCore = CORE;
/* ===== CORE END ===== */

/* ===== UI ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
const K = 'tasksplit.v2.';
let current = null;

function toast(m) {
  $('t').textContent = m;
  $('t').classList.add('on');
  clearTimeout(toast.x);
  toast.x = setTimeout(() => $('t').classList.remove('on'), 1800);
}

function copy(s) {
  const done = ok => toast(ok ? '已复制' : '复制失败，请长按选择');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(s).then(() => done(true), () => fallback(s, done));
  } else {
    fallback(s, done);
  }
}
function fallback(s, done) {
  try {
    const a = document.createElement('textarea');
    a.value = s; a.style.position = 'fixed'; a.style.opacity = '0';
    document.body.appendChild(a); a.select();
    const ok = document.execCommand('copy');
    a.remove(); done(ok);
  } catch (e) { done(false); }
}

function textFor(rows, key) {
  const p = CORE.plan(rows);
  if (key === 'json') return JSON.stringify(p, null, 2);
  if (key === 'all') return p.steps.map(x => `${x.id} [${x.route === 'light' ? 'L' : 'A'}] ${x.input}`).join('\n');
  const list = key === 'light' ? p.groups.light : p.groups.advanced;
  return list.map((x, i) => `${i + 1}. ${x}`).join('\n');
}

function run() {
  const txt = $('i').value.trim();
  localStorage.setItem(K + 'i', $('i').value);
  if (!txt) {
    $('o').innerHTML = '<div class="empty">上面输入后自动出结果。</div>';
    $('st').textContent = '';
    current = null;
    return;
  }
  const rows = CORE.segment(txt).map(t => ({ text: t, group: CORE.classify(t) }));
  const p = CORE.plan(rows);
  current = rows;
  const L = p.groups.light, A = p.groups.advanced;
  let h = '';
  if (L.length) {
    h += `<div class="box l" data-copy="light" title="点击复制这组"><div class="bh"><span class="bt l">轻量模型</span><span class="n">${L.length} 步</span><button data-copy="light">复制</button></div><ol>${L.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>`;
  }
  if (A.length) {
    h += `<div class="box a" data-copy="advanced" title="点击复制这组"><div class="bh"><span class="bt a">需要专用模型 / 先确认授权</span><span class="n">${A.length} 步</span><button data-copy="advanced">复制</button></div><ol>${A.map(x => `<li>${esc(x)}</li>`).join('')}</ol><p class="note">这些步骤可能涉及系统权限、第三方程序或安全边界，先确认你有授权再处理。</p></div>`;
  }
  if (!A.length) h += '<div class="empty">全部步骤轻量模型就能做。</div>';
  h += '<div class="acts"><button data-copy="all">复制全部</button><button data-copy="json">复制 JSON</button></div>';
  $('o').innerHTML = h;
  $('st').textContent = `已拆成 ${rows.length} 步 · 轻量 ${L.length} / 专用 ${A.length}`;

  $('o').querySelectorAll('[data-copy]').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      const s = textFor(current, el.dataset.copy);
      if (s) copy(s); else toast('这组没有内容');
    };
  });
}

let dt;
$('i').oninput = () => { clearTimeout(dt); dt = setTimeout(run, 260); };
try { $('i').value = localStorage.getItem(K + 'i') || ''; } catch (e) {}
if ($('i').value) run();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
